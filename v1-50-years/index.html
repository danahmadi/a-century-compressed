<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Fifty years of human capability, 1976 to 2026: how fast new things reach people, and the curves underneath.">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Fifty Years, Compressed</title>
<style>
:root{color-scheme:dark;--bg:#0d0f12;--ink:#eef0f2;--sub:#a3abb5;--faint:#727b86;--line:#262a31;--grid:#1a1d23;--hover:#15181d;--accent:#f2a63b;--accent-soft:rgba(242,166,59,.14);--sans:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media(prefers-color-scheme:light){:root{color-scheme:light;--bg:#f4f4f2;--ink:#16181b;--sub:#525a63;--faint:#7c848d;--line:#dcdcd8;--grid:#e7e7e3;--hover:#ebebe7;--accent:#c2410c;--accent-soft:rgba(194,65,12,.09)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);font-feature-settings:"tnum" 0}
a{color:var(--accent);text-underline-offset:3px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding:0 32px}
header.hero{padding:80px 0 64px}
h1{font-weight:650;font-size:clamp(40px,5.6vw,68px);line-height:1.04;letter-spacing:-.035em;margin:0 0 22px}
.lede{font-size:clamp(18px,1.9vw,21px);line-height:1.5;color:var(--sub);max-width:34em;margin:0}
.lede b{color:var(--ink);font-weight:600}
section.block{border-top:1px solid var(--line);padding:64px 0}
h2{font-weight:650;font-size:clamp(26px,3vw,34px);line-height:1.15;letter-spacing:-.025em;margin:0 0 10px}
.dek{color:var(--sub);max-width:62ch;margin:0 0 28px}
.chart{width:100%;position:relative}
.chart svg{display:block;overflow:visible}
.note{font-size:13px;color:var(--faint);margin:16px 0 0;max-width:80ch}
.grid{stroke:var(--grid);stroke-width:1}
.grid.now{stroke:var(--line);stroke-dasharray:3 4}
.t-axis{fill:var(--faint);font-size:11px;font-variant-numeric:tabular-nums}
.t-label{fill:var(--ink);font-size:13.5px}
.t-dur{fill:var(--accent);font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.t-point{fill:var(--sub);font-size:11px}
.seg{stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.seg.grow{stroke-dasharray:1;stroke-dashoffset:1;animation:grow 1s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes grow{to{stroke-dashoffset:0}}
.dot-start{fill:var(--bg);stroke:var(--accent);stroke-width:2}
.dot-end{fill:var(--accent)}
.row .hit{fill:transparent}
.row:hover .hit,.row:focus .hit{fill:var(--accent-soft)}
.row:focus{outline:none}
.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 28px}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.toggle button{border:0;background:transparent;border-radius:999px;padding:6px 16px;font-size:13px;color:var(--sub);cursor:pointer;min-height:34px}
.toggle button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.toggle-help{font-size:13px;color:var(--faint);margin:0}
.curves{display:grid;grid-template-columns:1fr 1fr;gap:48px 56px}
.curve{border-top:1px solid var(--line);padding-top:20px;min-width:0}
.curve h3{font-size:15px;font-weight:600;margin:0 0 2px}
.curve .unit{font-size:12.5px;color:var(--faint);margin:0 0 14px}
.curve .mult{font-weight:650;font-size:30px;line-height:1.1;letter-spacing:-.02em;color:var(--accent);margin:0}
.curve .mult small{font-size:13px;font-weight:400;letter-spacing:0;color:var(--sub);margin-left:8px}
.curve .plot{margin:12px 0 6px}
.curve .plot svg:focus{outline:none}
.curve .plot:focus-within{box-shadow:0 0 0 2px var(--accent);border-radius:6px}
.curve p.take{font-size:14px;color:var(--sub);margin:10px 0 6px}
.curve .src{font-size:12px;color:var(--faint);margin:0}
.series{fill:none;stroke:var(--accent);stroke-width:2.25;stroke-linejoin:round}
.pt{fill:var(--accent)}
.ring{fill:none;stroke:var(--ink);stroke-width:2}
.guide{stroke:var(--sub);stroke-dasharray:2 3}
.strip{position:relative;width:100%}
.strip .axis{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.strip .tick{position:absolute;font-size:11px;color:var(--faint);transform:translateX(-50%);font-variant-numeric:tabular-nums}
.strip .tickline{position:absolute;width:1px;background:var(--grid)}
.strip .stem{position:absolute;width:1px;background:var(--line);pointer-events:none}
.mdot{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border:0;padding:0;background:transparent;cursor:pointer;display:grid;place-items:center}
.mdot i{width:9px;height:9px;border-radius:50%;background:var(--sub);box-shadow:0 0 0 3px var(--bg)}
.mdot:hover i{background:var(--ink)}
.mdot[aria-pressed="true"] i{width:11px;height:11px;background:var(--accent)}
.mlabel{position:absolute;white-space:nowrap;font-size:12.5px;border:0;background:var(--bg);padding:2px 4px;color:var(--ink);cursor:pointer;border-radius:4px;line-height:1.25}
.mlabel:hover{background:var(--hover)}
.mlabel[aria-pressed="true"]{color:var(--accent)}
.mlabel small{display:block;font-size:10.5px;color:var(--faint)}
.card{display:grid;grid-template-columns:150px minmax(0,62ch);gap:18px;border-top:1px solid var(--line);margin-top:22px;padding-top:20px}
.card .when{font-weight:600;font-size:18px;color:var(--accent);font-variant-numeric:tabular-nums}
.card .dom{font-size:13px;color:var(--faint);margin-top:4px}
.card h3{font-weight:600;font-size:20px;line-height:1.25;letter-spacing:-.01em;margin:0 0 6px}
.card p{margin:0 0 6px;color:var(--sub);font-size:15px}
.card .src{font-size:13px;color:var(--faint)}
.mlist{list-style:none;margin:0;padding:0;columns:2;column-gap:48px}
.mlist li{break-inside:avoid}
.mlist button{display:grid;grid-template-columns:96px 1fr;gap:12px;width:100%;text-align:left;background:transparent;border:0;padding:7px 0;cursor:pointer}
.mlist .y{color:var(--faint);font-variant-numeric:tabular-nums;font-size:13px}
.mlist .tt{font-size:14px}
.mlist button[aria-pressed="true"] .tt{color:var(--accent)}
details{margin-top:16px}
summary{cursor:pointer;font-size:13px;color:var(--sub);min-height:32px}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
th{color:var(--faint);font-weight:500;border-bottom-color:var(--line)}
td{color:var(--sub)}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.honest{display:grid;grid-template-columns:1fr 1fr;gap:28px 56px;margin:0;padding:0;list-style:none}
.honest b{display:block;font-weight:600;margin-bottom:4px}
.honest span{color:var(--sub);font-size:14.5px}
.sources{columns:2;column-gap:48px;font-size:12.5px;color:var(--faint);padding-left:20px;margin:12px 0 0}
.sources li{margin-bottom:8px;break-inside:avoid;overflow-wrap:anywhere}
footer{border-top:1px solid var(--line);padding:28px 0 60px;font-size:12.5px;color:var(--faint)}
.tip{position:fixed;z-index:10;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.4;padding:9px 11px;border-radius:8px;max-width:280px;opacity:0;transition:opacity .12s;left:0;top:0}
.tip.on{opacity:1}
.tip b{display:block;font-size:13px}
.tip em{font-style:normal;opacity:.75;display:block;margin-top:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(max-width:900px){.curves{grid-template-columns:1fr}.honest{grid-template-columns:1fr}.sources,.mlist{columns:1}}
@media(max-width:640px){.wrap{padding:0 18px}header.hero{padding:56px 0 44px}section.block{padding:48px 0}.card{grid-template-columns:1fr;gap:6px}}
@media(prefers-reduced-motion:reduce){.seg.grow{animation:none;stroke-dashoffset:0}.tip{transition:none}}
@media print{.controls,.tip{display:none}body{background:#fff;color:#000}}
</style>
</head>

<header class="hero">
  <h1>Fifty years, compressed.</h1>
  <p class="lede" id="lede"></p>

<footer id="footer"></footer>
</div>

S fully operational","short":"GPS","line":"With 24 satellites in orbit, GPS was declared fully operational, giving positioning anywhere on Earth around the clock.","source":{"title":"GPS Frequently Asked Questions","publisher":"U.S. Coast Guard Navigation Center","url":"https://www.navcen.uscg.gov/gps-frequently-asked-questions"}},{"date":"1995-10-06","domain":"space","weight":2,"title":"First planet found around a Sun-like star","short":"First exoplanet","line":"Michel Mayor and Didier Queloz announced 51 Pegasi b. Thousands of exoplanets have been found since.","source":{"title":"The Nobel Prize in Physics 2019: Popular information","publisher":"NobelPrize.org","url":"https://www.nobelprize.org/prizes/physics/2019/popular-information/"}},{"date":"1996-07","domain":"medicine","weight":2,"title":"Combination therapy controls HIV","short":"HIV therapy","line":"Researchers at the Vancouver AIDS conference showed that three-drug therapy could suppress HIV, turning a fatal disease into a manageable one.","source":{"title":"Timeline of the HIV and AIDS Epidemic","publisher":"HIV.gov","url":"https://www.hiv.gov/hiv-basics/overview/history/hiv-and-aids-timeline"}},{"date":"1997-05-11","domain":"ai","weight":2,"title":"Deep Blue defeats Garry Kasparov","short":"Deep Blue","line":"IBM's chess computer beat the reigning world champion in a six-game match, 3.5 to 2.5.","source":{"title":"Defeating the World Chess Champion","publisher":"Computer History Museum","url":"https://www.computerhistory.org/chess/defeating-the-world-chess-champion/"}},{"date":"2006-06-08","domain":"medicine","weight":1,"title":"First HPV vaccine approved","short":"HPV vaccine","line":"The FDA approved Gardasil, the first vaccine against the virus types that cause most cervical cancer.","source":{"title":"Gardasil and Cervarix: An NIH Success Story","publisher":"National Cancer Institute","url":"https://techtransfer.cancer.gov/about/success-stories/gardasilcervarix"}},{"date":"2012-07-04","domain":"physics","weight":2,"title":"Higgs boson discovered","short":"Higgs boson","line":"CERN's ATLAS and CMS experiments announced a new particle consistent with the Higgs boson, the last undiscovered particle predicted by the Standard Model.","source":{"title":"CERN experiments observe particle consistent with long-sought Higgs boson","publisher":"CERN","url":"https://home.cern/cern-experiments-observe-particle-consistent-with-long-sought-higgs-boson/"}}],"domains":[{"id":"computing","label":"Computing"},{"id":"ai","label":"AI"},{"id":"biology","label":"Biology"},{"id":"medicine","label":"Medicine"},{"id":"space","label":"Space"},{"id":"physics","label":"Physics"},{"id":"energy","label":"Energy"}],"honest":[{"title":"Faster adoption builds on existing networks","body":"ChatGPT reached 100 million people quickly partly because about 5 billion were already online. The telephone needed a copper line to every house. Time to 100 million measures distribution as much as invention."},{"title":"Adoption figures use different yardsticks","body":"Subscriptions, accounts, installs and monthly users are not the same thing, and several figures are third-party estimates. Read each line as order-of-magnitude evidence. The table under the chart lists every measure and source."},{"title":"Exponential is not the same as accelerating","body":"Transistor counts and solar prices change at a near-constant rate, a straight line on the log scale. That is fast, but the rate is not rising. AI training compute is the clear case where the rate itself rose, from doubling every 20 months to every 6."},{"title":"Recent figures are the least certain","body":"Most frontier AI compute values after 2023 are Epoch AI estimates, not disclosures. The newest chips are multi-die packages. NHGRI's genome series ends in 2022. Each data table notes these cases."},{"title":"The milestones are a selection, not a measurement","body":"The milestone list is chosen for context, with a source for every entry. Its spacing proves nothing; a different curator would choose differently. The argument rests on the charts."},{"title":"Not everything sped up","body":"This page covers information technology and the sciences it powers. Plenty of the physical world, like building infrastructure or bringing most new drugs to market, has not sped up in anything like the same way."}]}</script>

const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// Dates are strings with year, month or day precision. Coarse dates sit at the middle of their interval.
function yf(s){
  const p=String(s).split('-').map(Number),[y,m=1,d=1]=p,a=Date.UTC(y,0,1),b=Date.UTC(y+1,0,1);
  if(p.length===1)return y+.5;
  if(p.length===2)return y+((Date.UTC(y,m-1,1)+Date.UTC(y,m,1))/2-a)/(b-a);
  return y+(Date.UTC(y,m-1,d)-a)/(b-a);
}
function dateLabel(s){const p=String(s).split('-').map(Number);if(p.length===1)return String(p[0]);if(p.length===2)return MONTHS[p[1]-1]+' '+p[0];return MONTHS[p[1]-1]+' '+p[2]+', '+p[0];}
const START=1976,END=yf(D.cutoff);

function el(tag,attrs,parent){const n=document.createElementNS(NS,tag);for(const k in attrs)n.setAttribute(k,attrs[k]);if(parent)parent.appendChild(n);return n;}
function txt(parent,x,y,s,cls,anchor){const t=el('text',{x,y,class:cls,'text-anchor':anchor||'start'},parent);t.textContent=s;return t;}

// Number formatting
const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const trim=n=>n>=100?String(Math.round(n)):n>=10?String(Math.round(n*10)/10):String(Math.round(n*100)/100);
function compact(v){const a=Math.abs(v);if(a>=1e12)return trim(v/1e12)+'T';if(a>=1e9)return trim(v/1e9)+'B';if(a>=1e6)return trim(v/1e6)+'M';if(a>=1e3)return trim(v/1e3)+'K';return trim(v);}
function sci(v){if(v===0)return '0';let e=Math.floor(Math.log10(v)),m=Math.round(v/10**e*10)/10;if(m>=10){m=1;e++;}return (m===1?'':m+'×')+'10'+String(e).split('').map(c=>SUP[c]).join('');}
function fmt(v,f){
  if(f==='flop')return sci(v);
  if(f==='usd'||f==='usdw'){if(v===0)return '$0';if(v<1)return '$'+v.toFixed(2);if(v<10)return '$'+(Math.round(v*10)/10);return '$'+compact(v);}
  return compact(v);
}
function ratioWords(r){
  const one=n=>n>=10?String(Math.round(n)):String(Math.round(n*10)/10);
  if(r>=1e12)return one(r/1e12)+' trillion';if(r>=1e9)return one(r/1e9)+' billion';if(r>=1e6)return one(r/1e6)+' million';
  if(r>=1e4)return Math.round(r/1e3).toLocaleString('en-US')+',000';return Math.round(r).toLocaleString('en-US');
}

// Tooltip
const tip=$('#tip');
function showTip(html,x,y){tip.innerHTML=html;tip.classList.add('on');const r=tip.getBoundingClientRect();let l=x+14,t=y+14;if(l+r.width>innerWidth-8)l=x-r.width-14;if(t+r.height>innerHeight-8)t=y-r.height-14;tip.style.left=Math.max(8,l)+'px';tip.style.top=Math.max(8,t)+'px';}
function hideTip(){tip.classList.remove('on');}
const announce=s=>{$('#live').textContent=s;};

// Derived facts used in prose, so the words always match the data.
const A=D.adoption.items.slice().sort((a,b)=>yf(a.launch)-yf(b.launch));
const first=A[0],fastest=A.reduce((m,i)=>i.days<m.days?i:m,A[0]);
const anchor=A.find(i=>i.id===D.adoption.headline)||fastest;
const curveFacts=D.curves.map(c=>{const p=c.points.slice().sort((a,b)=>yf(a.date)-yf(b.date)),a=p.find(v=>v.base)||p[0],b=p[p.length-1];
  return {c,a,b,ratio:c.dir==='up'?b.value/a.value:a.value/b.value};});

const cap=v=>v.charAt(0).toUpperCase()+v.slice(1);
$('#lede').innerHTML=`${esc(cap(first.lower))} took <b>${esc(first.label.replace('about ',''))}</b> to reach 100 million people. ${esc(cap(anchor.lower))} took <b>${esc(anchor.label)}</b>.`;

$('#adoption-dek').textContent=`Each line runs from public launch to 100 million users. The ${D.adoption.reference.name.toLowerCase()}, launched in ${D.adoption.reference.launch}, took ${D.adoption.reference.label}.`;
$('#adoption-note').textContent=D.adoption.note;
$('#adoption-table').innerHTML='<thead><tr><th>Technology</th><th>Launch</th><th>To 100M</th><th>Measure and caveat</th><th>Source</th></tr></thead><tbody>'+A.map(i=>`<tr><td>${esc(i.name)}</td><td class="n">${esc(dateLabel(i.launch))}</td><td class="n">${esc(i.label)}</td><td>${esc(i.metric)}${i.caveat?'. '+esc(i.caveat):''}</td><td>${i.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.publisher)}</a>`).join(', ')}</td></tr>`).join('')+'</tbody>';
let introDone=false;
function drawAdoption(){
  const host=$('#adoption-chart');host.innerHTML='';
  const W=host.clientWidth,narrow=W<640,L=narrow?4:196,R=narrow?4:110,top=28,rowH=narrow?50:38,H=top+A.length*rowH+4;
  const svg=el('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`,'aria-hidden':'false'},host);
  const x=v=>L+(v-START)/(END-START)*(W-L-R);
  for(let yr=1980;yr<=2020;yr+=10){el('line',{x1:x(yr),x2:x(yr),y1:top-6,y2:H,class:'grid'},svg);txt(svg,x(yr),top-12,String(yr),'t-axis','middle');}
  el('line',{x1:x(END),x2:x(END),y1:top-6,y2:H,class:'grid now'},svg);if(!narrow)txt(svg,x(END),top-12,'Now','t-axis','middle');
  A.forEach((it,i)=>{
    const y0=top+i*rowH,cy=narrow?y0+rowH-14:y0+rowH/2,a=yf(it.launch),x1=x(a),x2=Math.max(x1+.5,x(a+it.days/365.25));
    const g=el('g',{class:'row',tabindex:'0',role:'listitem','aria-label':`${it.name}. Launched ${dateLabel(it.launch)}. Reached 100 million ${it.unit} in ${it.label}.`},svg);
    el('rect',{x:0,y:y0+1,width:W,height:rowH-2,rx:6,class:'hit'},g);
    const seg=el('line',{x1,x2,y1:cy,y2:cy,class:'seg',pathLength:'1'},g);
    if(!introDone&&!reduceMotion){seg.classList.add('grow');seg.style.animationDelay=(160+i*110)+'ms';}
    el('circle',{cx:x1,cy,r:4,class:'dot-start'},g);el('circle',{cx:x2,cy,r:5.5,class:'dot-end'},g);
    if(narrow){txt(g,Math.min(x1,W-150),cy-13,it.name,'t-label');const t=txt(g,x2+10,cy+4.5,it.label,'t-dur');if(x2+10+it.label.length*7.6>W){t.setAttribute('x',x1-10);t.setAttribute('text-anchor','end');}}
    else{txt(g,L-18,cy+4.5,it.name,'t-label','end');txt(g,x2+12,cy+4.5,it.label,'t-dur');}
    const html=`<b>${esc(it.name)}</b>Launched ${esc(dateLabel(it.launch))} · ${esc(it.label)} to 100M<em>${esc(it.metric)}${it.caveat?'. '+esc(it.caveat):''}</em>`;
    g.addEventListener('pointermove',e=>showTip(html,e.clientX,e.clientY));g.addEventListener('pointerleave',hideTip);
    g.addEventListener('focus',()=>{const r=g.getBoundingClientRect();showTip(html,r.left+x2,r.top+rowH/2);});g.addEventListener('blur',hideTip);
  });
  introDone=true;
}

// 02 Curves
// Start in log scale with #log in the URL.
let mode=location.hash==='#log'?'log':'linear';
const help={linear:'Linear scale shows absolute values.',log:'Log scale: each gridline is 10×, and a straight line means a constant rate of change.'};
$('#curves').innerHTML=curveFacts.map(f=>`<article class="curve" data-curve="${f.c.id}"><h3>${esc(f.c.title)}</h3><p class="unit">${esc(f.c.unit)}</p><p class="mult">${ratioWords(f.ratio)}×<small>${esc(f.c.multLabel)} since ${String(f.a.date).slice(0,4)}</small></p><div class="plot"></div><p class="take">${esc(f.c.takeaway)}</p><p class="src">Source: ${f.c.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.publisher)}</a>`).join(', ')}</p>
  <details><summary>Data</summary><table><thead><tr><th>Date</th><th>${f.c.style==='scatter'?'System':'Point'}</th><th>Value</th></tr></thead><tbody>${f.c.points.map(p=>`<tr><td class="n">${esc(dateLabel(p.date))}</td><td>${esc(p.name||'')}${p.note?' <small>('+esc(p.note)+')</small>':''}</td><td class="n">${esc(fmt(p.value,f.c.format))}</td></tr>`).join('')}</tbody></table></details></article>`).join('');
function niceMax(v){const k=10**Math.floor(Math.log10(v));for(const m of [1,1.2,1.5,2,2.5,3,4,5,6,8,10])if(m*k>=v)return m*k;return 10*k;}
function drawCurve(card){
  const c=D.curves.find(v=>v.id===card.dataset.curve),host=card.querySelector('.plot');host.innerHTML='';
  const W=host.clientWidth,H=W<420?200:232,L=54,R=10,T=22,B=24;
  const pts=c.points.map(p=>({t:yf(p.date),v:p.value,p})).sort((a,b)=>a.t-b.t),vals=pts.map(p=>p.v);
  let y,ticks=[];
  if(mode==='log'){let lo=Math.floor(Math.log10(Math.min(...vals))),hi=Math.ceil(Math.log10(Math.max(...vals)));if(hi===lo)hi++;
    y=v=>T+(hi-Math.log10(v))/(hi-lo)*(H-T-B);const step=Math.max(1,Math.ceil((hi-lo)/5));for(let e=hi;e>=lo;e-=step)ticks.push(10**e);}
  else{const hi=niceMax(Math.max(...vals));y=v=>T+(1-v/hi)*(H-T-B);ticks=[0,.25,.5,.75,1].map(f=>f*hi);}
  const x=t=>L+(t-START)/(END-START)*(W-L-R);
  const svg=el('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`,tabindex:'0',role:'img','aria-label':`${c.title}, ${mode} scale. ${pts.length} data points. Use left and right arrow keys to read values.`},host);
  for(const v of ticks){el('line',{x1:L,x2:W-R,y1:y(v),y2:y(v),class:'grid'},svg);txt(svg,L-8,y(v)+3.5,fmt(v,c.format),'t-axis','end');}
  for(let yr=1980;yr<=2020;yr+=10)txt(svg,x(yr),H-6,String(yr),'t-axis','middle');
  if(c.style==='line')el('path',{d:pts.map((p,i)=>(i?'L':'M')+x(p.t).toFixed(1)+' '+y(p.v).toFixed(1)).join(' '),class:'series'},svg);
  for(const p of pts)el('circle',{cx:x(p.t),cy:y(p.v),r:c.style==='line'?2.2:3.6,class:'pt'+(p.p.soft?' soft':'')},svg);
  // Point labels only where they can be read: all flagged points on log, the latest one on linear.
  // Labels go where the trend leaves empty space: upper-left of rising points, upper-right of falling ones.
  for(const p of pts.filter((p,i)=>p.p.label&&(mode==='log'||i===pts.length-1))){
    const px=x(p.t),py=y(p.v),s=p.p.short||p.p.name,w=s.length*6.2;let tx=px-8,ty=py-8,a='end';
    if(c.dir==='up'&&px-8-w<L){tx=px+8;ty=py+13;a='start';}
    if(c.dir==='down'){if(px+8+w<W-R){tx=px+8;a='start';}else continue;}
    txt(svg,tx,ty,s,'t-point',a);}
  const ring=el('circle',{r:6.5,class:'ring',visibility:'hidden'},svg),guide=el('line',{class:'guide',visibility:'hidden'},svg);
  let idx=-1;
  const show=(i,cx,cy)=>{idx=i;const p=pts[i],px=x(p.t),py=y(p.v);ring.setAttribute('cx',px);ring.setAttribute('cy',py);ring.setAttribute('visibility','visible');
    guide.setAttribute('x1',px);guide.setAttribute('x2',px);guide.setAttribute('y1',py+7);guide.setAttribute('y2',H-B);guide.setAttribute('visibility','visible');
    const html=`<b>${esc(p.p.name||dateLabel(p.p.date))}</b>${esc(dateLabel(p.p.date))} · ${esc(fmt(p.v,c.format))} ${esc(c.tipUnit)}${p.p.note?`<em>${esc(p.p.note)}</em>`:''}`;
    const r=svg.getBoundingClientRect();showTip(html,cx??r.left+px,cy??r.top+py);};
  const clear=()=>{ring.setAttribute('visibility','hidden');guide.setAttribute('visibility','hidden');hideTip();};
  svg.addEventListener('pointermove',e=>{const r=svg.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;let best=0,bd=Infinity;
    pts.forEach((p,i)=>{const d=(x(p.t)-mx)**2+((y(p.v)-my)*.35)**2;if(d<bd){bd=d;best=i;}});show(best,e.clientX,e.clientY);});
  svg.addEventListener('pointerleave',clear);svg.addEventListener('blur',clear);
  svg.addEventListener('keydown',e=>{if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;e.preventDefault();const i=Math.max(0,Math.min(pts.length-1,(idx<0?(e.key==='ArrowRight'?-1:pts.length):idx)+(e.key==='ArrowRight'?1:-1)));show(i);const p=pts[i];announce(`${p.p.name||''} ${dateLabel(p.p.date)}: ${fmt(p.v,c.format)} ${c.tipUnit}`);});
}
function drawCurves(){document.querySelectorAll('[data-curve]').forEach(drawCurve);$('#toggle-help').textContent=help[mode];}
document.querySelectorAll('[data-mode]').forEach(v=>v.setAttribute('aria-pressed',String(v.dataset.mode===mode)));
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(v=>v.setAttribute('aria-pressed',String(v===b)));drawCurves();announce(`Charts switched to ${mode} scale.`);}));

// 03 Milestones
const DOMAINS=D.domains;
const M=D.milestones.slice().sort((a,b)=>yf(a.date)-yf(b.date));
let selected=M.length-1;
$('#milestones-dek').textContent=`${M.length} landmarks across science, medicine, space and computing, each with a primary source. The selection is subjective; the charts above are the evidence.`;
const dlabel=id=>DOMAINS.find(d=>d.id===id).label;
function select(i,focus){selected=i;const m=M[i];
  $('#mcard').innerHTML=`<div><div class="when">${esc(dateLabel(m.date))}</div><div class="dom">${esc(dlabel(m.domain))}</div></div><div><h3>${esc(m.title)}</h3><p>${esc(m.line)}</p><span class="src">Source: ${esc(m.source.publisher)}, <a href="${esc(m.source.url)}" target="_blank" rel="noopener noreferrer">${esc(m.source.title)}</a></span></div>`;
  document.querySelectorAll('[data-m]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.m)===i)));
  if(focus){const d=document.querySelector(`.mdot[data-m="${i}"]`);if(d)d.focus();}
}
$('#mlist').innerHTML=M.map((m,i)=>`<li><button type="button" data-m="${i}" aria-pressed="false"><span class="y">${esc(dateLabel(m.date))}</span><span class="tt">${esc(m.title)}</span></button></li>`).join('');
$('#mlist').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b)select(Number(b.dataset.m));});
function drawStrip(){
  const host=$('#strip');host.innerHTML='';const W=host.clientWidth,narrow=W<600,pad=16;
  const x=t=>pad+(t-START)/(END-START)*(W-2*pad);
  const ROWS=narrow?3:5,rowH=34,axisY=ROWS*rowH+18;
  // Beeswarm the dots below the axis so none overlap.
  const placed=[];let maxLevel=0;
  M.forEach((m,i)=>{const px=x(yf(m.date));let lv=0;while(placed.some(p=>p.lv===lv&&Math.abs(p.x-px)<15))lv++;placed.push({x:px,lv,i});maxLevel=Math.max(maxLevel,lv);});
  const H=axisY+18+maxLevel*15+30;host.style.height=H+'px';
  host.insertAdjacentHTML('beforeend',`<div class="axis" style="top:${axisY}px"></div>`);
  for(let yr=1980;yr<=2020;yr+=10)host.insertAdjacentHTML('beforeend',`<div class="tickline" style="left:${x(yr)}px;top:0;height:${H-22}px"></div><div class="tick" style="left:${x(yr)}px;top:${H-18}px">${yr}</div>`);
  // Labels: most important first, greedy into rows above the axis; unplaced milestones keep their dot.
  const taken=Array.from({length:ROWS},()=>[]);
  const order=M.map((m,i)=>i).sort((a,b)=>(M[b].weight||1)-(M[a].weight||1)||yf(M[b].date)-yf(M[a].date));
  for(const i of order){const m=M[i],p=placed.find(v=>v.i===i);
    const lab=document.createElement('button');lab.type='button';lab.className='mlabel';lab.dataset.m=i;lab.tabIndex=-1;
    lab.innerHTML=`${esc(m.short||m.title)}<small>${String(m.date).slice(0,4)}</small>`;host.appendChild(lab);
    const w=lab.offsetWidth,left=Math.max(0,Math.min(W-w,p.x-w/2));let row=-1;
    for(let r=0;r<ROWS;r++)if(!taken[r].some(([a,b])=>left<b+10&&left+w>a-10)){row=r;break;}
    if(row<0){lab.remove();continue;}
    taken[row].push([left,left+w]);const top=axisY-26-(row+1)*rowH+8;
    lab.style.left=left+'px';lab.style.top=top+'px';lab.setAttribute('aria-hidden','true');
    host.insertAdjacentHTML('afterbegin',`<div class="stem" style="left:${p.x}px;top:${top+lab.offsetHeight}px;height:${axisY-top-lab.offsetHeight}px"></div>`);
  }
  for(const p of placed){const m=M[p.i];const b=document.createElement('button');b.type='button';b.className='mdot';b.dataset.m=p.i;
    b.style.cssText=`left:${p.x}px;top:${axisY+(p.lv?14+p.lv*15:0)}px`;b.setAttribute('aria-label',`${m.title}, ${dateLabel(m.date)}`);b.setAttribute('aria-pressed','false');b.innerHTML='<i></i>';
    b.tabIndex=p.i===selected?0:-1;host.appendChild(b);}
  host.querySelectorAll('[data-m]').forEach(b=>{const i=Number(b.dataset.m),m=M[i];
    b.addEventListener('click',()=>select(i));
    if(b.classList.contains('mdot')){b.addEventListener('pointerenter',e=>showTip(`<b>${esc(m.title)}</b>${esc(dateLabel(m.date))}`,e.clientX,e.clientY));b.addEventListener('pointerleave',hideTip);}
  });
  host.addEventListener('keydown',e=>{const d=e.target.closest('.mdot');if(!d||(e.key!=='ArrowRight'&&e.key!=='ArrowLeft'))return;e.preventDefault();
    const i=Math.max(0,Math.min(M.length-1,Number(d.dataset.m)+(e.key==='ArrowRight'?1:-1)));host.querySelectorAll('.mdot').forEach(v=>v.tabIndex=Number(v.dataset.m)===i?0:-1);select(i,true);});
  select(selected);
}

// 04 Honest notes and sources
$('#honest').innerHTML=D.honest.map(h=>`<li><b>${esc(h.title)}</b><span>${esc(h.body)}</span></li>`).join('');
const all=new Map();
for(const i of A)for(const s of i.sources)all.set(s.url,s);
for(const c of D.curves)for(const s of c.sources)all.set(s.url,s);
for(const m of M)all.set(m.source.url,m.source);
all.set(D.adoption.reference.source.url,D.adoption.reference.source);
$('#sources-summary').textContent=`Sources (${all.size})`;
$('#sources').innerHTML=[...all.values()].map(s=>`<li>${esc(s.publisher)}, <a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a></li>`).join('');
$('#footer').textContent=`By Dan Ahmadi, built with Craft Agent. Data checked ${dateLabel(D.cutoff)}. Works offline; source links need the internet. Figures are as reported by the cited sources, several of which are estimates.`;

function drawAll(){drawAdoption();drawCurves();drawStrip();}
let frame,lastW=0;new ResizeObserver(()=>{const w=document.body.clientWidth;if(w===lastW)return;lastW=w;cancelAnimationFrame(frame);frame=requestAnimationFrame(drawAll);}).observe(document.body);
</script>
</body>
